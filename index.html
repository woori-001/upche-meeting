<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업체회의 누적분석</title>
<!-- 업체회의 누적분석 Ver8.0 · 화면은 깃허브(woori-001/upche-meeting), 데이터는 구글시트(Apps Script) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f5f9; --surface:#fff; --soft:#f6f8fb; --line:#eaedf2; --line2:#dfe3ea;
  --text:#1c2230; --sub:#7d8697; --dim:#a8afbc;
  --pri:#4c82f7; --pri-d:#3a6fe6; --pri-w:#edf3ff; --pri-w2:#dbe7ff;
  --up:#e5484d; --up-w:#fdecec; --down:#3b6fe0; --down-w:#eaf1ff;
  --green:#1f9d6b; --green-w:#e6f6ef; --violet:#7a5af5; --violet-w:#f0ecfe;
  --shadow:0 1px 2px rgba(20,30,50,.04),0 4px 16px rgba(20,30,50,.05);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}

/* ---------- 사이드바 ---------- */
#side{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);padding:0;display:flex;flex-direction:column}
.side-top{flex:none;padding:26px 14px 0}
.side-mid{flex:1;min-height:0;overflow-y:auto;padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.side-mid>*{flex:none}
.side-bottom{flex:none;padding:8px 14px 14px;border-top:1px solid var(--line);background:var(--surface)}
.brand{height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}.logo-t{font-size:22px;font-weight:800;letter-spacing:.02em;color:#0b3a6e}.brand img{display:block;width:132px;height:auto;margin:0 auto}
.brand b{display:block;font-size:16px}.brand small{color:var(--sub);font-size:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center}
.side-sec{font-size:12px;color:var(--sub);padding:14px 8px 6px;font-weight:600}
.spaces{display:flex;flex-direction:column;gap:2px}
.space{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 8px;border-radius:12px;cursor:pointer;text-align:left}
.space:hover{background:var(--soft)}
.space.on{background:var(--pri-w)}
.space.on .stxt b{color:var(--pri-d)}
.sico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.sico.blue{background:var(--pri-w2);color:var(--pri-d)}.sico.green{background:var(--green-w);color:var(--green)}.sico.violet{background:var(--violet-w);color:var(--violet)}
.stxt b{display:block;font-size:14px;font-weight:600}.stxt small{color:var(--sub);font-size:12px}
.side-info{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px}
.side-info div{display:flex;justify-content:space-between;padding:3px 0}
.side-info span{color:var(--sub)}
.side-info .note{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--sub);font-size:11.5px;line-height:1.55;display:flex;flex-direction:column}
.side-info .note .nf{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a5263}
.side-actions{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.side-actions .ghost{justify-content:flex-start;border:0;background:none;padding:8px 10px;color:#4a5263}
.side-actions .ghost:hover{background:var(--soft)}
.side-hr{border:0;border-top:1px solid var(--line);margin:12px 6px}
.side-bottom{display:flex;flex-direction:column;gap:4px}
.side-bottom .del{border:0;background:none;justify-content:flex-start;padding:8px 8px;color:var(--sub);font-weight:500}
.side-bottom .del:hover{background:var(--up-w);color:var(--up)}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:4px 6px;word-break:break-all}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--pri-w2);color:var(--pri-d);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

/* ---------- 공통 버튼 ---------- */
.primary,.ghost,.danger{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.primary{background:var(--pri);border:1px solid var(--pri);color:#fff}.primary:hover{background:var(--pri-d)}
.ghost{background:var(--surface);border:1px solid var(--line2);color:#3a4252}.ghost:hover{border-color:var(--pri);color:var(--pri-d)}
.danger{background:var(--up);border:1px solid var(--up);color:#fff}
.soft{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;background:#e8f3ff;border:1px solid #cfe4ff;color:#2a6fd6;transition:background .15s}
.soft:hover{background:#d7eaff;border-color:#b5d6ff}
.icon{border:0;background:none;cursor:pointer;color:var(--sub);padding:6px;border-radius:8px;display:grid;place-items:center}.icon:hover{background:var(--soft);color:var(--text)}

/* ---------- 메인 ---------- */
#main{padding:26px 32px 60px;max-width:1440px;width:100%}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}
.top h1{font-size:24px;line-height:32px;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:13px;margin:2px 0 0;font-weight:400}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:0 10px;color:var(--sub);height:38px}
.field:focus-within{border-color:var(--pri)}
.field select,.field input{border:0;outline:0;background:none;color:var(--text);height:36px;font-weight:500}
.field input{width:150px}

/* KPI */
.kpis{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr) minmax(0,3fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.kl{font-size:12.5px;color:var(--sub);font-weight:500}
.kv{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kv small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
.ks{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.gauge{height:6px;border-radius:6px;background:#eef1f6;overflow:hidden;margin:4px 0 2px}.gauge b{display:block;height:100%;background:var(--pri);border-radius:6px}

/* 칩 / 태그 / 배지 */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:#eff1f5;color:var(--sub);font-variant-numeric:tabular-nums}
.chip.up{background:var(--up-w);color:var(--up)}.chip.down{background:var(--down-w);color:var(--down)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:#667085;background:#f0f2f6;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.lg{font-size:12.5px;padding:4px 10px;margin:0;border-radius:8px;font-weight:500}
.badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px}
.badge.blue{background:var(--pri-w);color:var(--pri-d)}.badge.green{background:var(--green-w);color:var(--green)}.badge.red{background:var(--up-w);color:var(--up)}.badge.violet{background:var(--violet-w);color:var(--violet)}
.up{color:var(--up)}.down{color:var(--down)}.bad{color:var(--up)}.warnt{color:var(--up)}
.dim{color:var(--dim)}.small{font-size:12px}.b{font-weight:700}

/* 보드 (신규 / 재거래 / 이탈) */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:20px}
.col{background:#eceff5;border-radius:18px;padding:14px;display:flex;flex-direction:column;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:31px}
.col-h h3{margin:0;font-size:15.5px;font-weight:700}.col-h h3 em{font-style:normal;color:var(--pri);margin-left:4px}
.col-s{font-size:12.5px;color:var(--sub);margin:6px 2px 10px}
.col-b{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding:2px;margin:-2px}
.bcard{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.bc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bc-name{font-weight:700;font-size:14.5px;margin-bottom:4px}
.bc-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--sub)}
.bc-meta b{color:var(--text);font-size:14px;white-space:nowrap}
.bc-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.bempty{background:rgba(255,255,255,.55);border:1px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--sub);font-size:13px}
.never{margin-top:4px;background:rgba(255,255,255,.6);border-radius:12px;padding:10px 12px}
.never summary{cursor:pointer;color:var(--sub);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 필 / 탭 */
.pills{display:inline-flex;background:#e7ebf2;border-radius:10px;padding:3px;gap:2px}
.pills button{border:0;background:none;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--sub);font-weight:500;white-space:nowrap}
.pills button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.1)}
.pills.sm button{padding:3px 8px;font-size:12px}
.col .pills{background:#dfe4ec}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:4px 0 14px}
.tabs button{border:0;background:none;padding:8px 2px;cursor:pointer;color:var(--sub);font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--text)}

/* 카드 섹션 */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;margin:0;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.stats>div{background:var(--soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:120px}
.stats span{font-size:12px;color:var(--sub)}.stats b{font-size:17px;font-variant-numeric:tabular-nums}.stats small{font-size:11.5px;color:var(--dim)}
.stats em{font-style:normal;font-size:12px;font-weight:600}

/* 표 */
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.t th{background:#f8f9fb;text-align:left;font-weight:600;color:var(--sub);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid #f1f3f6;white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:#fafbfd}
.t .n{text-align:right;font-variant-numeric:tabular-nums}
.t td.cur{font-weight:700;background:var(--pri-w)}
.t tbody tr:hover td.cur{background:var(--pri-w2)}

th.sortable{cursor:pointer;user-select:none}th.sortable:hover,th.sortable.on{color:var(--pri-d)}
.none{color:var(--dim);text-align:center;padding:26px!important}
a.pn{cursor:pointer;text-decoration:none;font-weight:600}a.pn:hover{color:var(--pri-d);text-decoration:underline;text-underline-offset:3px}
.rate{display:flex;align-items:center;gap:8px;min-width:150px}
.rate .bar{position:relative;flex:1;height:8px;border-radius:8px;background:#eef1f6;overflow:visible}
.rate .bar b{display:block;height:100%;border-radius:8px;background:#9db9fb}
.rate .bar .avg{position:absolute;top:-3px;width:2px;height:14px;background:#5b6475;border-radius:1px}
.rate span{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.rate.bad .bar b{background:var(--up)}.rate.bad span{color:var(--up);font-weight:700}
.foot-note{display:flex;gap:8px;align-items:flex-start;color:var(--sub);font-size:12.5px;margin:14px 0 0;background:var(--soft);border-radius:12px;padding:12px 14px}
.foot-note svg{flex:none;margin-top:2px}
.foot{color:var(--dim);font-size:12px;margin:0 4px}

/* 빈 화면 */
.empty{max-width:560px;margin:60px auto;padding:30px 30px 26px}
.empty h2{margin:14px 0 2px;font-size:22px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:4px;background:#e7ebf2}.steps i.on{background:var(--pri)}.steps i.done{background:var(--pri-w2)}
.stepl{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
.stepl li{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:14px}
.stepl li>span{width:24px;height:24px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.stepl li.done>span{background:var(--pri)}
.stepl li div{flex:1}.stepl b{display:block}.stepl small{color:var(--sub);font-size:12.5px}
.stepl em{font-style:normal;color:var(--pri-d);font-weight:600;font-size:13px}

/* 상세 패널 */
#scrim{position:fixed;inset:0;background:rgba(15,20,30,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));background:var(--surface);border-radius:20px;box-shadow:0 10px 40px rgba(15,20,30,.18);padding:22px 24px;overflow:auto;transform:translateX(110%);transition:transform .25s ease;z-index:21}
.dr-open #scrim{opacity:1;pointer-events:auto}.dr-open #drawer{transform:none}
.dr-h{display:flex;justify-content:space-between;gap:10px}
.dr-h h3{margin:8px 0 0;font-size:20px}
.dr-tags{display:flex;gap:6px;align-items:center}.dr-tags .tag{margin:0}
.dr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
.dr-stats div{background:var(--soft);border-radius:12px;padding:10px 12px}.dr-stats span{display:block;font-size:12px;color:var(--sub)}.dr-stats b{font-size:16px}
#drawer h4{font-size:14px;margin:18px 0 10px}
.mchart{display:flex;gap:6px;align-items:flex-end;height:150px;padding:0 2px}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.mcb{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:#f2f4f8}
.mcb b{display:block}.mcb .w,.legend .w{background:var(--pri)}.mcb .m,.legend .m{background:#9db9fb}.mcb .r,.legend .r{background:#c9d7fb}
.mcv{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}.mcl{font-size:11px;color:var(--sub)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t.sm{font-size:13px}.t.sm th,.t.sm td{padding:7px 8px}
#drawer .t{border:1px solid var(--line);border-radius:12px}

/* 모달 / 토스트 / 로딩 */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.3);display:flex;align-items:flex-start;justify-content:center;z-index:30;padding:80px 16px;overflow:auto}
#modal[hidden],#toast[hidden],#busy[hidden]{display:none}
.mbox{background:#fff;border-radius:20px;padding:24px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(15,20,30,.18)}
.mbox h3{margin:0 0 4px;font-size:19px}
.chk{cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(640px,calc(100vw - 32px));background:#1f2533;color:#fff;padding:14px 18px;border-radius:14px;font-size:13.5px;z-index:40;cursor:pointer;box-shadow:0 8px 30px rgba(15,20,30,.25);line-height:1.6}
#toast a{color:#9ec0ff}
#busy{position:fixed;inset:0;background:rgba(243,245,249,.75);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50}
#busy>div{background:#fff;border-radius:16px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-weight:500}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--pri-w2);border-top-color:var(--pri);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}



/* 증감 · 품질 표 (그룹 머리글) */
.t thead{position:sticky;top:0;z-index:3}
.t th.grp{text-align:center;border-left:1px solid var(--line);color:var(--text);font-weight:700}
.t th.grp2{border-left:1px solid var(--line);vertical-align:middle;line-height:1.3}
.t th.sub2{font-weight:500;font-size:12px;padding:6px 10px}
.t th.curg{background:#e6eeff;color:var(--pri-d)}
.t .gl{border-left:1px solid var(--line)}
.t .stick{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--line)}
.t th.stick{background:#f8f9fb;z-index:4;vertical-align:middle}
.t tbody tr:hover td.stick{background:#fafbfd}
.t.grow td,.t.q td{padding:8px 10px}
.t tr.flag td{background:#fff3f3}
.t tr.flag td.stick{background:#fff3f3}
.t tbody tr.flag:hover td{background:#ffeaea}
.t td.badc{background:#ffd9d9!important;color:#c62828;font-weight:800}
.warnb{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--up);border-radius:6px;padding:1px 6px;vertical-align:1px}
.warnbox{background:#fff0f0!important}.warnbox b{color:var(--up)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.legend2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px;margin-top:14px;background:var(--soft);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--sub)}
.legend2 b{color:var(--text);margin-right:4px}.legend2 b.bad{color:var(--up)}
/* 통신사 선택 줄 */
.telbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:-6px 0 18px}
.telbar>span{font-size:13px;font-weight:600;color:var(--sub)}
.telbar small{font-size:12px;color:var(--sub)}
.telbar .pills,.hbtns .pills{flex-wrap:wrap}
.telb{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--pri);border-radius:6px;padding:1px 7px}
.telb.big{font-size:14px;padding:2px 9px;vertical-align:4px;margin-left:4px}
/* 상세 패널: 통신사별 */
.tsplit{display:flex;flex-direction:column;gap:8px}
.ts-row{display:grid;grid-template-columns:70px 1fr 64px;align-items:center;gap:4px 10px}
.ts-n{font-weight:600;font-size:13px}.ts-v{text-align:right;font-weight:700;font-size:13px}
.ts-bar{height:8px;border-radius:8px;background:#eef1f6;overflow:hidden}.ts-bar b{display:block;height:100%;background:var(--pri);border-radius:8px}
.ts-d{grid-column:2/4;font-size:12px;color:var(--sub);margin-top:-4px}


/* 년월 달력 */
.mp{position:relative}
.mp-btn{cursor:pointer;gap:8px}.mp-btn b{color:var(--text);font-weight:600}.caret{font-size:11px;color:var(--sub)}
.mp-pop{position:absolute;top:44px;left:0;z-index:15;width:252px;background:#fff;border-radius:16px;box-shadow:0 10px 36px rgba(15,20,30,.16);padding:14px 14px 10px}
.mp-pop[hidden]{display:none}
.mp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mp-h b{font-size:15px}
.mp-h .icon{font-size:20px;line-height:1;width:30px;height:30px}.mp-h .icon[disabled]{opacity:.25;cursor:default}
.mp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mp-m{border:0;background:none;border-radius:20px;padding:8px 0;cursor:pointer;font-size:13.5px;color:var(--text)}
.mp-m:hover:not([disabled]){background:var(--pri-w)}
.mp-m.on{background:var(--pri);color:#fff;font-weight:700}
.mp-m[disabled]{color:#c5cad3;cursor:default}
.mp-n{margin:8px 0 0;font-size:11.5px;color:var(--dim);text-align:center}
/* 통신사 펼치기 */
.tg{border:0;background:#eef1f6;color:var(--sub);width:20px;height:20px;border-radius:6px;cursor:pointer;margin-right:6px;font-size:10px;line-height:20px;padding:0;transition:transform .15s;vertical-align:1px}
.tg:hover{background:var(--pri-w2);color:var(--pri-d)}
.tg.on{transform:rotate(90deg);background:var(--pri);color:#fff}
.tg-sp{display:inline-block;width:26px}
.tcount{font-size:11px;color:var(--dim);margin-left:6px}
.t tr.subrow td{background:#fafbfd;font-size:12.5px;padding-top:6px;padding-bottom:6px}
.t tr.subrow td.stick{background:#fafbfd}
.t tr.subrow td.cur{background:#eef3ff}
.tsub{display:inline-block;margin-left:34px;padding-left:10px;border-left:2px solid var(--pri-w2);color:#4a5263;font-weight:600}
.ghost.sm{padding:6px 11px;font-size:12.5px}

#fatal{position:fixed;left:50%;top:40px;transform:translateX(-50%);z-index:99;max-width:min(640px,calc(100vw - 32px));background:#fff;border:2px solid #e5484d;color:#1c2230;border-radius:14px;padding:16px 18px;font-size:13.5px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#fatal small{color:#7d8697}

/* 요약 묶음 카드 */
.kt{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}.kt span{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.krow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.ksub{padding:2px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ksub+.ksub{border-left:1px solid var(--line)}
.ksub:first-child{padding-left:0}
.ksub .kl{font-size:12.5px}
/* 사이드바 달력 */
.side-cal{background:var(--soft);border-radius:12px;padding:10px 8px 8px;margin-bottom:10px}
.side-cal .mp-h{margin-bottom:6px}.side-cal .mp-h b{font-size:14px}
.side-cal .mp-g{gap:2px}
.side-cal .mp-m{padding:6px 0;font-size:12.5px}
/* 사이드바 지표 설명 */
.side-help{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.side-help summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:10px 12px;font-size:12.5px;font-weight:700;color:#4a5263}
.side-help summary::-webkit-details-marker{display:none}
.side-help summary svg{color:var(--pri)}
.side-help .chev{margin-left:auto;font-size:10px;color:var(--dim);transition:transform .15s}
.side-help[open] .chev{transform:rotate(180deg)}
.side-help[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}
.hl{padding:6px 12px 10px;display:flex;flex-direction:column}
.hi{display:flex;gap:9px;padding:8px 0}.hi+.hi{border-top:1px dashed var(--line)}
.hi>i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}
.hi b{display:block;font-size:12.5px;color:var(--text)}
.hi p{margin:2px 0 0;font-size:11.5px;line-height:1.5;color:var(--sub)}
.hi p.f{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:6px;background:var(--soft);color:#3a4252;font-weight:600;font-size:11px}
.c-blue{background:var(--pri)}.c-orange{background:#f59e0b}.c-violet{background:var(--violet)}.c-green{background:var(--green)}.c-red{background:var(--up)}
.side-bottom .side-hr{margin:6px 4px}


/* 스크롤바: 가늘고 하얀 반투명 */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.75) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.75);border:1px solid rgba(20,30,50,.10);border-radius:8px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.95);border-color:rgba(20,30,50,.18)}
::-webkit-scrollbar-corner{background:transparent}

.segb{display:inline-block;vertical-align:2px;margin-left:6px;font-size:12px;font-weight:600;color:var(--pri-d);background:var(--pri-w);border-radius:6px;padding:2px 8px}
.ksub .ks{line-height:1.5;display:block;white-space:nowrap}.ksub .ks b{color:var(--text)}
.card-h{margin-bottom:12px}
/* 품질 표: 비율 + 건수 */
.t.q td{padding-top:7px;padding-bottom:7px}
.t td.rc{line-height:1.25}
.rc .rv{display:block;font-weight:600;font-size:13.5px;color:var(--text)}
.rc .rn{display:block;margin-top:2px;font-size:11px;color:#a3abb8;white-space:nowrap;letter-spacing:.01em}
.rc .rn i{font-style:normal;margin:0 2px;color:#cfd4dc}
.t td.rc.zero .rv{color:#b8bec9;font-weight:500}
.t td.badc .rv{color:#c62828}.t td.badc .rn{color:#d9534f}
.t th.grp small,.t th.grp2 small{display:inline-block;margin-left:4px;font-weight:500;color:#a3abb8;font-size:11px}
.t th.grp2 small{margin:2px 0 0}

/* 로그인 */
#login{position:fixed;inset:0;z-index:45;background:linear-gradient(160deg,#eef3ff 0%,#f3f5f9 60%);display:flex;align-items:center;justify-content:center;padding:20px}
#login[hidden]{display:none}
.lcard{width:min(380px,100%);background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(20,30,50,.12);padding:30px 28px 22px;display:flex;flex-direction:column;gap:10px}
.lbrand{display:flex;justify-content:center;margin-bottom:6px}.lbrand img{width:150px}
.lcard h2{margin:6px 0 0;font-size:19px;text-align:center}.lcard>.sub{text-align:center;margin:0 0 6px}
.lcard label,.pwf label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#4a5263}
.lcard input,.pwf input{font:inherit;font-weight:400;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:0}
.lcard input:focus,.pwf input:focus{border-color:var(--pri)}
.lbtn{justify-content:center;padding:11px;font-size:14.5px;margin-top:4px}
.loginerr{min-height:18px;margin:0;color:var(--up);font-size:12.5px}
.lset{margin-top:8px;font-size:12.5px;color:var(--sub)}.lset summary{cursor:pointer}
.lurl{display:flex;gap:6px;margin-top:6px}.lurl input{flex:1;min-width:0;font-size:12px}
.pwf{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.me{flex-wrap:wrap}.me-n{display:flex;flex-direction:column;line-height:1.3;font-weight:600;color:var(--text)}.me-n small{font-weight:400;color:var(--sub);font-size:11px}
.me-a{margin-left:auto;display:flex;gap:6px}
button.link{border:0;background:none;padding:2px 4px;font-size:11.5px;color:var(--sub);cursor:pointer;border-radius:6px}button.link:hover{background:var(--soft);color:var(--pri-d)}

/* 반응형 */
@media (max-width:1280px){.kpis{grid-template-columns:1fr}}
@media (max-width:1024px){.board{grid-template-columns:1fr}.col-b{max-height:320px}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  #side{position:static;height:auto;flex-direction:column;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .spaces{flex-direction:row;overflow:auto}.space{flex:1;min-width:0}
  .side-sec,.side-info,.side-actions,.me,.side-hr,.side-bottom{display:none!important}
  .brand img{width:110px}
  .brand{padding-bottom:6px}
  #main{padding:18px 16px 50px}
  .kpis{grid-template-columns:1fr}.krow{grid-template-columns:1fr}.ksub{padding:8px 0}.ksub+.ksub{border-left:0;border-top:1px solid var(--line)}
  .side-help{display:none}.side-cal{margin-top:8px}
  #side{height:auto;overflow:visible}.side-mid{overflow:visible;padding-bottom:0}.side-top{padding-top:14px}
  .top-r{width:100%}.field{flex:1 1 150px}.field input{width:100%}.top-r .primary,.top-r .ghost{flex:1 1 auto;justify-content:center}
  .dr-stats{grid-template-columns:repeat(2,1fr)}
}

<script>
// 화면이 비는 대신 오류 내용을 보여준다
window.__showErr = function (msg) {
  var b = document.getElementById("fatal");
  if (!b) { b = document.createElement("div"); b.id = "fatal"; document.body.appendChild(b); }
  b.innerHTML = "<b>화면을 그리는 중 오류가 났어요</b><br>" + String(msg).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +
    "<br><small>이 화면을 캡처해서 보내주세요. Apps Script의 index.html이 끝까지 붙여넣어졌는지도 확인해 주세요.</small>";
};
window.addEventListener("error", function (e) { window.__showErr((e.message || "") + (e.lineno ? " (줄 " + e.lineno + ")" : "")); });
// 앱 코드가 끝까지 읽히지 않았으면(붙여넣기가 잘린 경우 등) 5초 뒤 안내
setTimeout(function () { if (!window.__appLoaded) window.__showErr("앱 코드를 끝까지 읽지 못했어요. index.html 내용이 중간에 잘렸을 수 있어요 (파일 맨 끝이 </html> 로 끝나는지 확인)"); }, 5000);
window.addEventListener("unhandledrejection", function (e) { window.__showErr(e.reason && e.reason.message ? e.reason.message : e.reason); });
</script>

<script>
"use strict";
// ============================================================
// 업체회의 누적분석 Ver8.0 (화면: 깃허브 / 데이터: 구글시트 + Apps Script)
// - 접수 데이터(전체정산관리 엑셀)를 월별로 구글시트 탭(접수_YYYY-MM)에 누적 저장
// - 협력점정보(원장)는 "협력점정보" 탭에 저장
// - 한 화면: 요약 / 신규 / 이탈 / 증감 / 품질
// ============================================================

const APP_VER = "8.0";

// ---------- 규칙 상수 (인수인계서 참조) ----------
// 분석 제외 유형(신규가입이 아닌 접수): 상품명+상품옵션에 아래 단어가 있으면 제외
const EXCL_RE = /약정갱신|재약정|약갱|업셀링|전환|부가상품|부가서비스|명의변경|이전설치/;
// 정산성 행(접수가 아님)
const ADMIN_RE = /정산|추가지급|민원/;
// 제휴 강제 지정 (원장상 자점이지만 실제 제휴처)
const FORCE_ALLY = new Set(["●케이티텔레캅 충북지사", "★큐스코●", "●패스앤슈팅", "☆삼쩜삼"]);
const SYM_RE = /^[●♥♡○★☆■□◆◇◎]+/;
const PARTNER_SYMBOL_RE = /[●♥♡○★☆■□◆◇◎]/g;
const RESUB_DAYS = 60; // 취소 후 이 기간 안에 같은 고객·같은 구분 접수가 있으면 재접수
const G_LABEL = { W: "유선", M: "무선", R: "렌탈" };
const ST_LABEL = { O: "개통", H: "해지", C: "취소", P: "진행중" };

// ---------- 유틸 ----------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (n) => (n == null || isNaN(n)) ? "-" : Math.round(n).toLocaleString("ko-KR");
const fmtR = (r) => (r == null || !isFinite(r)) ? "-" : (r * 100).toFixed(1) + "%";
const fmtAvg = (n) => (n == null || isNaN(n)) ? "-" : (Math.round(n * 10) / 10).toLocaleString("ko-KR");
const monthLabel = (m) => m ? `${m.slice(2, 4)}.${m.slice(5, 7)}` : "";
function addMonths(m, k) {
  let y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + k;
  y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
  return `${y}-${String(mo + 1).padStart(2, "0")}`;
}
function fmtDelta(cur, base) {
  if (base == null) return { txt: "-", cls: "" };
  const d = cur - base;
  if (base === 0) return cur > 0 ? { txt: "신규발생", cls: "up" } : { txt: "-", cls: "" };
  const pct = d / base * 100;
  if (Math.abs(pct) < 0.05) return { txt: "0.0%", cls: "" };
  return { txt: (pct > 0 ? "▲" : "▼") + Math.abs(pct).toFixed(1) + "%", cls: pct > 0 ? "up" : "down" };
}

// ---------- 등급 / 구분 ----------
function gradeOf(name, group) {
  if (FORCE_ALLY.has(name)) return "제휴";
  const s = String(group || "").replace(SYM_RE, "").trim();
  if (!s) return "";
  if (s.startsWith("자점_") || s.startsWith("본점_")) return "자점";
  if (s === "판매점_VIP" || s === "판매점_일반") return "판";
  if (s === "판매점_A") return "판매A";
  if (s === "판매점_A_지점정책") return "지점";
  if (s === "판매점_구로지사") return "구로";
  if (s === "판매점_우주커넥트관리") return "우주";
  if (s === "협력점_A_생산") return "A생산";
  if (s === "협력점_A_도매") return "A도매";
  if (s === "협력점_B") return "B";
  if (s === "협력점_C") return "C";
  if (s === "협력점_D" || s.startsWith("협력점_D_")) return "D";
  if (s.startsWith("협력점_S_") || s === "협력점_컨택") return "협의";
  if (s === "상부점") return "상부점";
  return s.replace(/^(협력점_|판매점_)/, ""); // 표에 없는 새 정산그룹: 원문 표시(담당자 확인 필요)
}
function segmentOf(name, group) {
  if (FORCE_ALLY.has(name)) return "제휴";
  const s = String(group || "").replace(SYM_RE, "").trim();
  if (s.startsWith("판매점_")) return "판매점";
  if (s.startsWith("협력점_")) return "협력점";
  return null; // 자점·본점·상부점 등 → 분석 제외
}
const coreName = (n) => String(n).replace(PARTNER_SYMBOL_RE, "").replace(/\(휴\)/g, "").trim();

// ---------- 고객 식별 (마킹 대응) ----------
// 전산은 지난 달 자료부터 고객명 2번째 글자, 연락처 끝 4자리를 가린다(홍*동 / 010-1234-****).
// 가려지지 않은 당월 자료와도 맞도록, 모든 자료를 같은 방식으로 가린 형태로 통일해서 비교한다.
function canonName(n) {
  let s = String(n || "").split("/")[0];
  s = s.replace(/\(.*?\)|[\s\d]/g, "");
  if (!s) return "";
  return s.length >= 2 ? s[0] + "*" + s.slice(2) : s;
}
function canonPhone(p) {
  const d = String(p || "").replace(/\D/g, "");
  return d.length >= 7 ? d.slice(0, 7) : "";
}
const VALID_KEY_RE = /^\d{7}\|.+/;

function statusCode(s) {
  s = String(s || "");
  if (s === "개통완료") return "O";
  if (s.includes("해지")) return "H";                                   // 개통 후 해지
  if (s.includes("취소") || s.includes("반품") || s.includes("반송")) return "C"; // 개통 전 취소
  return "P";
}
function groupOf(prod) {
  if (prod.startsWith("모바일_")) return "M";
  if (prod.startsWith("렌탈_")) return "R";
  return "W";
}
// 통신사: 상품명 앞부분으로 판정. 렌탈은 통신사가 없어 "" (통신사 필터가 "전체"일 때만 집계)
const TELCOS = ["KT", "SKT", "SKB", "LG U+", "SKYLIFE", "헬로비전", "기타"];
function normTelco(t) {
  t = String(t || "").trim().toUpperCase();
  if (t === "KT") return "KT";
  if (t === "SKT") return "SKT";
  if (t === "SKB" || t === "SK") return "SKB";
  if (t === "LG" || t === "LG U+" || t === "LGU+") return "LG U+";
  if (t === "SKYLIFE") return "SKYLIFE";
  if (t === "HELLOVISION" || t === "HV") return "헬로비전";
  return "기타";
}
function telcoOf(prod) {
  if (prod.startsWith("렌탈_")) return "";
  let m = prod.match(/^모바일_(.+)$/); if (m) return normTelco(m[1]);
  m = prod.match(/^유선기타_\((\w+)-biz\)/); if (m) return normTelco(m[1]);
  m = prod.match(/^유선기타_다회선([A-Za-z]+)/); if (m) return normTelco(m[1]);
  const i = prod.indexOf("_");
  return normTelco(i > 0 ? prod.slice(0, i) : prod);
}
const isInet = (prod) => /인터넷(\(|$)/.test(prod) && !prod.includes("인터넷전화");

// ---------- 엑셀 파싱 ----------
function sniffFormat(buffer) {
  const h = new Uint8Array(buffer, 0, Math.min(8, buffer.byteLength));
  if (h[0] === 0x50 && h[1] === 0x4B && (h[2] === 0x03 || h[2] === 0x05 || h[2] === 0x07)) return "workbook";
  if (h[0] === 0xD0 && h[1] === 0xCF && h[2] === 0x11 && h[3] === 0xE0) return "workbook";
  return "text";
}
function decodeText(buffer) {
  let text = "";
  try { text = new TextDecoder("euc-kr").decode(buffer); } catch (e) { text = ""; }
  if (!text || (!text.includes("협력점") && !text.includes("상품명") && !text.includes("상호명"))) {
    try {
      const utf = new TextDecoder("utf-8").decode(buffer);
      if (utf.includes("협력점") || utf.includes("상품명") || utf.includes("상호명") || !text) text = utf;
    } catch (e) {}
  }
  return text;
}
function cellStr(v) {
  if (v == null) return "";
  if (v instanceof Date) {
    const p = (x) => String(x).padStart(2, "0");
    return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())} ${p(v.getHours())}:${p(v.getMinutes())}`;
  }
  return String(v).trim();
}
// 2차원 배열(행) 반환. 워크북/HTML표 모두 지원 (매직바이트 판별 + 실패 시 반대방식 재시도)
async function readRows(file) {
  const buffer = await file.arrayBuffer();
  const kind = sniffFormat(buffer);
  const tryWb = () => {
    const wb = XLSX.read(buffer, { type: "array", cellDates: true, dense: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }).map(r => (r || []).map(cellStr));
  };
  const tryHtml = () => {
    const text = decodeText(buffer);
    if (!/<t(r|able)[\s>]/i.test(text)) throw new Error("테이블을 찾을 수 없음");
    const doc = new DOMParser().parseFromString(text, "text/html");
    return Array.from(doc.querySelectorAll("tr")).map(tr => Array.from(tr.querySelectorAll("th,td")).map(c => c.textContent.trim()));
  };
  const order = kind === "workbook" ? [tryWb, tryHtml] : [tryHtml, tryWb];
  let err = null;
  for (const f of order) {
    try { const rows = f(); if (rows.length > 1) return rows; } catch (e) { err = err || e; }
  }
  throw new Error("파일을 읽을 수 없음" + (err ? `: ${err.message}` : ""));
}
// 헤더 행 찾기 + 2단 헤더(차감내역 하위 칸) 처리
function findHeader(rows, must) {
  for (let i = 0; i < Math.min(6, rows.length); i++) {
    const r = rows[i].map(x => String(x || "").trim());
    if (must.every(k => r.includes(k))) {
      const next = rows[i + 1] || [];
      let skip = 0;
      const names = r.slice();
      // 다음 행이 "헤더 빈칸 위치에만 값이 있는" 하위 헤더면 합치고 건너뛴다
      const subOnly = next.length && next.some(x => x) && next.every((x, j) => !x || !r[j]);
      if (subOnly) { next.forEach((x, j) => { if (x && !names[j]) names[j] = "차감_" + x; }); skip = 1; }
      return { idx: i, names, start: i + 1 + skip };
    }
  }
  return null;
}

// 접수 데이터 → 월별 접수 단위(unit) 목록
// unit = [협력점, 구분(W/M/R), 접수일(YYYY-MM-DD), 상태(O/H/C/P), 제외유형(0/1), 고객키, 통신사]
function buildUnits(rows) {
  const h = findHeader(rows, ["상품명", "협력점"]);
  if (!h) throw new Error("필수 컬럼(상품명, 협력점)을 찾을 수 없습니다. 첫 줄: " + (rows[0] || []).slice(0, 10).join(", "));
  const col = (...names) => { for (const n of names) { const i = h.names.indexOf(n); if (i >= 0) return i; } return -1; };
  const C = {
    kind: col("정산종류"), name: col("고객명"), phone: col("명의자연락처", "명의자 연락처"),
    prod: col("상품명"), opt: col("상품옵션"), partner: col("협력점"),
    date: col("접수일", "최초등록일"), stat: col("개통상태"),
  };
  if (C.date < 0) throw new Error("접수일(또는 최초등록일) 컬럼이 없습니다.");
  const g = (r, i) => i >= 0 ? String(r[i] == null ? "" : r[i]).trim() : "";
  const units = [];
  const wired = new Map();
  let rawRows = 0, skipped = 0;
  for (let i = h.start; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r.length) continue;
    const partner = g(r, C.partner), prod = g(r, C.prod);
    if (!partner || !prod) { skipped++; continue; }
    const kind = g(r, C.kind);
    if (kind && kind !== "일반") { skipped++; continue; }       // 환수/추가 행 제외
    const opt = g(r, C.opt), stat = g(r, C.stat);
    if (ADMIN_RE.test(prod + " " + opt + " " + stat) || prod.endsWith("_관리")) { skipped++; continue; }
    const t = g(r, C.date);
    if (!/^\d{4}-\d{2}/.test(t)) { skipped++; continue; }
    rawRows++;
    const grp = groupOf(prod);
    const ex = EXCL_RE.test(prod + " " + opt) ? 1 : 0;
    const st = statusCode(stat);
    const key = canonPhone(g(r, C.phone)) + "|" + canonName(g(r, C.name));
    const tel = telcoOf(prod);
    if (grp !== "W") { units.push([partner, grp, t.slice(0, 10), st, ex, key, tel]); continue; }
    // 유선은 "고객 1명의 접수 1번" = 1건 (인터넷 회선 기준). 같은 협력점·같은 고객·같은 접수시각 행을 묶는다.
    const wk = partner + "\u0001" + key + "\u0001" + t;
    let o = wired.get(wk);
    if (!o) { o = { partner, t, key, rows: [] }; wired.set(wk, o); }
    o.rows.push({ ex, st, inet: isInet(prod), tel });
  }
  for (const o of wired.values()) {
    const fresh = o.rows.filter(x => !x.ex);
    const ex = fresh.length ? 0 : 1;
    const base = fresh.length ? fresh : o.rows;
    const inet = base.filter(x => x.inet);
    if (inet.length) {
      for (const x of inet) units.push([o.partner, "W", o.t.slice(0, 10), x.st, ex, o.key, x.tel]);
    } else {
      const s = new Set(base.map(x => x.st));
      const st = s.has("O") ? "O" : s.has("H") ? "H" : s.has("P") ? "P" : "C";
      units.push([o.partner, "W", o.t.slice(0, 10), st, ex, o.key, base[0].tel]);
    }
  }
  return { units, rawRows, skipped };

// 원장 → 행 [상호명, 정산그룹, 거래유무, 협력점, 등록일]

    rows.push({ p, vals, cur, avg, pct, curT, avgT, pctT: avgT ? (curT - avgT) / avgT : null });
  }
  const getters = { name: r => r.p.dataName, cur: r => r.curT, pct: r => r.pctT ?? -1e9 };
  show.forEach((m, i) => ALLG.forEach(g => { getters[`m${i}${g}`] = r => r.vals[i][g]; }));
  ALLG.forEach(g => { getters["a" + g] = r => r.avg[g] ?? -1; getters["p" + g] = r => r.pct[g] ?? -1e9; });

function calcQuality(M) {
  const ms = periodMonths(M, S.qPeriod);
  const blank = () => ({ n: 0, C: 0, RE: 0, H: 0, O: 0, EX: 0 });
  const tot = { W: blank(), M: blank(), R: blank(), ALL: blank() };
  const rows = [];
  for (const p of segPartners()) {
    const by = {}; for (const g of ALLG) by[g] = sumCells(p.dataName, ms, [g]);
    const all = sumCells(p.dataName, ms, ALLG);
    if (!all.n && !all.EX) continue;
    for (const g of ALLG) for (const k in tot[g]) tot[g][k] += by[g][k];
    for (const k in tot.ALL) tot.ALL[k] += all[k];
    rows.push({ p, by, all });
  }
  const avg = { W: rates(tot.W), M: rates(tot.M), R: rates(tot.R), ALL: rates(tot.ALL) };
  // 칸마다 주의 판정 (같은 구분의 평균과 비교)
  for (const r of rows) {
    r.rt = {}; r.bad = {};
    for (const g of ALLG) {
      const o = r.by[g], x = rates(o); r.rt[g] = x;
      r.bad["c" + g] = isBad(x.cancel, avg[g].cancel, o.n, o.C - o.RE);
      r.bad["t" + g] = isBad(x.term, avg[g].term, o.O + o.H, o.H);
    }
    r.rt.ALL = rates(r.all);
    r.bad.f = isBad(r.rt.ALL.fresh, avg.ALL.fresh, r.all.n + r.all.EX, r.all.EX, false);
    r.flag = Object.values(r.bad).some(Boolean);
  }
  const flagged = rows.filter(r => r.flag).length;
  let view = rows.filter(r => matchSearch(r.p.dataName) && (!S.qOnlyBad || r.flag));
  const getters = { name: r => r.p.dataName, fresh: r => r.rt.ALL.fresh ?? -1, ex: r => r.all.EX };
  ALLG.forEach(g => { getters["n" + g] = r => r.by[g].n; getters["c" + g] = r => r.rt[g].cancel ?? -1; getters["t" + g] = r => r.rt[g].term ?? -1; });
  sortRows(view, "q", getters, "nW");
  return { ms, rows: view, avg, flagged };
}

function telcoSplitHtml(name) {

async function onDataFiles(files, skippedNames = []) {
  if (!files.length) return;
  // 협력점정보가 섞여 있으면 먼저 처리되도록 파일명에 "협력점"이 들어간 파일을 앞으로
  files = files.slice().sort((a, b) => (/협력점|원장/.test(b.name) ? 1 : 0) - (/협력점|원장/.test(a.name) ? 1 : 0));
  busy(true, "파일 읽는 중...");
  const byMonth = {}; const log = [];
  try {
    for (const f of files) {
      busy(true, `${f.name} 읽는 중... (큰 파일은 10초 정도 걸립니다)`);
      await new Promise(r => setTimeout(r, 30));
      const rows = await readRows(f);
      if (findHeader(rows, ["상호명", "정산그룹"]) && !findHeader(rows, ["상품명", "협력점"])) {
        await applyMaster(rows, f.name); log.push(`${esc(f.name)}: 협력점정보로 인식해 원장을 갱신했습니다.`); continue;
      }
      const { units, rawRows } = buildUnits(rows);
      const cnt = {};
      for (const u of units) { const m = u[2].slice(0, 7); (byMonth[m] = byMonth[m] || { units: [], files: new Set(), raw: 0 }).units.push(u); byMonth[m].files.add(f.name); cnt[m] = (cnt[m] || 0) + 1; }
      log.push(`${esc(f.name)}: ${fmtN(rawRows)}행 → ${Object.keys(cnt).sort().map(m => `${monthLabel(m)} ${fmtN(cnt[m])}건`).join(", ")}`);
    }
    const replaced = [];
    const todo = Object.keys(byMonth).sort();
    let done = 0;
    for (const m of todo) {
      busy(true, `구글시트에 저장 중... ${monthLabel(m)} (${++done}/${todo.length})`);
      const file = [...byMonth[m].files].join(", ");
      const r = await gs("saveMonth", m, unitsToTsv(byMonth[m].units), file);
      if (r.replaced) replaced.push(monthLabel(m));
      S.months[m] = { units: byMonth[m].units, file };
    }
    derive();
    const ms = Object.keys(byMonth).sort();
    if (ms.length) S.month = D.months[D.months.length - 1];
    render();
    toast(`<b>업로드 완료</b><br>${log.join("<br>")}${replaced.length ? `<br>교체된 월: ${replaced.join(", ")} (같은 달은 새 파일로 통째로 바뀝니다)` : ""}${skippedNames.length ? `<br>엑셀이 아니라서 건너뛴 파일: ${skippedNames.map(esc).join(", ")}` : ""}`, 12000);
  } catch (e) {
    toast(`<b>오류</b> ${esc(e.message)}`, 0);
  } finally { busy(false); }
}
async function applyMaster(rows, fileName) {
  const mrows = buildMaster(rows);
  busy(true, "협력점정보를 구글시트에 저장 중...");
  const r = await gs("saveMaster", mrows, fileName);

}
function guessDate(fn) {

async function onMasterFile(files) {

}

function loadScript(src) {
  return new Promise((res, rej) => { const x = document.createElement("script"); x.src = src; x.onload = res; x.onerror = rej; document.head.appendChild(x); });
}
async function loadExcelJS() {
  if (window.ExcelJS) return;
  try { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"); }
  catch (e) { await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"); }
  if (!window.ExcelJS) throw new Error("엑셀 저장 라이브러리를 불러오지 못했어요 (회사망에서 cdnjs / jsdelivr 주소가 막혔는지 확인해 주세요)");
}
const XC = { head: "FFF3F5F9", grp: "FFE9EEF6", cur: "FFE6EEFF", curText: "FF2F5FD0", line: "FFDFE3EA", flag: "FFFFF3F3", bad: "FFFFD9D9", badText: "FFC62828", up: "FFE5484D", down: "FF3B6FE0", sub: "FF7D8697", title: "FF1C2230" };
const xFill = (argb) => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
const xBorder = { top: { style: "thin", color: { argb: XC.line } }, bottom: { style: "thin", color: { argb: XC.line } }, left: { style: "thin", color: { argb: XC.line } }, right: { style: "thin", color: { argb: XC.line } } };
function xTitle(ws, text, sub, width) {
  ws.addRow([text]).font = { bold: true, size: 14, color: { argb: XC.title } };
  if (sub) ws.addRow([sub]).font = { size: 10, color: { argb: XC.sub } };
  ws.addRow([]);
}
function xHeader(ws, rows, merges, curCols) {
  const start = ws.rowCount + 1;
  rows.forEach(r => { const row = ws.addRow(r); row.height = 20; row.eachCell({ includeEmpty: true }, c => {
    c.font = { bold: true, size: 10 }; c.fill = xFill(XC.head); c.border = xBorder; c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
  }); });
  merges.forEach(([r1, c1, r2, c2]) => ws.mergeCells(start + r1, c1, start + r2, c2));
  (curCols || []).forEach(c => { for (let i = 0; i < rows.length; i++) { const x = ws.getCell(start + i, c); x.fill = xFill(XC.cur); x.font = { bold: true, size: 10, color: { argb: XC.curText } }; } });
  return start + rows.length; // 데이터 시작 행
}
function xRow(ws, vals, opt = {}) {
  const row = ws.addRow(vals);
  row.eachCell({ includeEmpty: true }, (c, i) => {
    c.border = xBorder; c.font = { size: 10, bold: !!opt.bold && i === 1 };
    if (i > 1) c.alignment = { horizontal: "right" };
    if (opt.fill) c.fill = xFill(opt.fill);
  });
  if (opt.sub) { row.outlineLevel = 1; row.hidden = true; row.getCell(1).font = { size: 10, color: { argb: XC.sub } }; row.getCell(1).alignment = { indent: 2 }; }
  return row;
}

// ---------- 로그인 ----------
function showLogin(msg) {
  const box = $("#login");
  box.hidden = false;
  $("#loginErr").textContent = msg || "";
  $("#loginUrl").value = apiUrl().indexOf("__API") === 0 ? "" : apiUrl();
  setTimeout(() => { const i = $("#loginId"); if (i && !i.value) i.focus(); else if ($("#loginPw")) $("#loginPw").focus(); }, 50);
}
async function doLogin(e) {
  e.preventDefault();
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginErr").textContent = "";
  try {
    const j = await api({ action: "login", id: $("#loginId").value.trim(), password: $("#loginPw").value });
    lsSet(LS_KEY.token, j.token); lsSet(LS_KEY.user, JSON.stringify(j.user));
    $("#loginPw").value = "";
    $("#login").hidden = true;
    await loadAll();
  } catch (err) { $("#loginErr").textContent = err.message; }
  finally { btn.disabled = false; }
}
function logout() {
  lsSet(LS_KEY.token, null); lsSet(LS_KEY.user, null);
  S.months = {}; S.master = null; S.user = null; derive(); render();
  showLogin("로그아웃했어요.");
}
function openPwModal() {
  const box = $("#modal");
  box.innerHTML = `<div class="mbox small"><h3>비밀번호 변경</h3><p class="sub">${esc(S.user ? S.user.name : "")} 계정</p>
    <form id="pwForm" class="pwf">
      <label>현재 비밀번호<input type="password" id="pwCur" autocomplete="current-password" required></label>
      <label>새 비밀번호 (4자 이상)<input type="password" id="pwNew" autocomplete="new-password" required></label>
      <label>새 비밀번호 확인<input type="password" id="pwNew2" autocomplete="new-password" required></label>
      <p class="loginerr" id="pwErr"></p>
      <div class="mfoot"><button type="button" id="mclose" class="ghost">취소</button><button type="submit" class="primary">변경</button></div></form></div>`;
  box.hidden = false;
  $("#mclose").onclick = () => box.hidden = true;
  $("#pwForm").onsubmit = async (e) => {
    e.preventDefault();
    if ($("#pwNew").value !== $("#pwNew2").value) { $("#pwErr").textContent = "새 비밀번호가 서로 달라요."; return; }
    try { await gs("changePassword", $("#pwCur").value, $("#pwNew").value); box.hidden = true; toast("비밀번호를 바꿨어요."); }
    catch (err) { $("#pwErr").textContent = err.message; }

}
function saveUrl() {
  const v = $("#loginUrl").value.trim();
  lsSet(LS_KEY.url, v || null);
  $("#loginErr").textContent = v ? "서버 주소를 저장했어요. 로그인해 주세요." : "기본 서버 주소로 되돌렸어요.";
}

async function loadAll() {
  busy(true, "구글시트에서 데이터 불러오는 중...");
  S.months = {};
  try {
    const info = await gs("getInfo");
    S.user = info.user || null;
    S.master = info.master.length ? { rows: info.master.map(r => r.map(x => String(x).trim())), note: info.masterNote } : null;
    let done = 0;
    await pool(info.months.map(x => x.m), 4, async (m) => {
      const tsv = await gs("getMonth", m);
      S.months[m] = { units: tsvToUnits(tsv) };
      busy(true, `구글시트에서 데이터 불러오는 중... ${++done}/${info.months.length}개월`);
    });
  } catch (e) {
    if (!e.auth) toast(`<b>서버 연결 오류</b> ${esc(e.message)}`, 0);
  } finally { busy(false); }
  derive();
  if (D.months.length) S.month = D.months[D.months.length - 1];
  render();
}

async function init() {
  const pick = (id, fn) => { const i = $(id); i.onchange = () => { fn([...i.files]); i.value = ""; }; };
  pick("#fData", onDataFiles); pick("#fMaster", onMasterFile);
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDetail(); $("#modal").hidden = true; } });
  $("#scrim").onclick = closeDetail;
  $("#modal").onclick = (e) => { if (e.target.id === "modal") $("#modal").hidden = true; };
  $("#toast").onclick = (e) => { if (e.target.tagName !== "A") $("#toast").hidden = true; };
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { e.preventDefault(); if (lsGet(LS_KEY.token)) onDataFiles([...e.dataTransfer.files]); });
  $("#loginForm").onsubmit = doLogin;
  $("#loginUrlSave").onclick = saveUrl;
  derive(); render();
  if (!lsGet(LS_KEY.token)) { showLogin(); return; }
  try { S.user = JSON.parse(lsGet(LS_KEY.user) || "null"); } catch (e) {}
  await loadAll();
}
if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", init); else init();
window.__appLoaded = true; // 이 줄이 실행되면 앱 코드가 끝까지 읽힌 것

</script>
